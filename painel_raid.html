<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Painel de Raids ao Vivo - Tap Titans 2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #0f141c; color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 10px 8px; min-height: 100vh; }
    .back-btn { align-self: flex-start; max-width: 1750px; margin: 0 auto 8px auto; width: 100%; text-decoration: none; color: #8fa0b5; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; background: #141c26; border: 1px solid #233142; }
    .container { width: 100%; max-width: 1750px; background: #18202a; border: 1px solid #283545; border-radius: 16px; padding: 14px; }
    .top-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .title { font-size: 20px; font-weight: 800; text-transform: uppercase; margin: 0; }
    .title span { color: #f5a623; }
    .subtitle { font-size: 11.5px; color: #8fa0b5; margin-bottom: 14px; }
    .titan-dashboard-layout { display: grid; grid-template-columns: 280px 1fr; gap: 12px; align-items: start; }
    .titan-info-box { background: #121922; border: 1.5px solid #3a4b60; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .titan-zone-row { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 6px; }
    .badge-zone { background: rgba(179, 136, 255, 0.16); border: 1.5px solid #b388ff; color: #b388ff; font-weight: 900; font-size: 11px; padding: 2.5px 8px; border-radius: 6px; }
    .buff-badge-display { display: inline-flex; align-items: center; gap: 5px; background: rgba(56, 161, 243, 0.14); border: 1px solid rgba(56, 161, 243, 0.5); border-radius: 5px; padding: 2px 7px; }
    .buff-badge-text { font-size: 10px; font-weight: 900; color: #38a1f3; }
    .titan-name-row { display: flex; justify-content: space-between; }
    .titan-seq { background: #f5a623; color: #0f141c; font-weight: 900; font-size: 11.5px; padding: 2px 7px; border-radius: 5px; }
    .titan-name-text { font-size: 15.5px; font-weight: 800; color: #ffffff; }
    .badge-ciclo-tag { background: rgba(245, 166, 35, 0.16); border: 1.5px solid #f5a623; color: #f5a623; font-size: 10.5px; font-weight: 900; padding: 2.5px 8px; border-radius: 6px; }
    .hp-overall-box { display: flex; flex-direction: column; gap: 3px; background: #18222e; border: 1px solid #283748; padding: 7px 9px; border-radius: 8px; }
    .hp-overall-labels { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700; }
    .hp-bar-outer { width: 100%; height: 10px; background: #0a0e14; border-radius: 5px; border: 1px solid #2b394a; }
    .hp-bar-fill-overall { height: 100%; background: linear-gradient(90deg, #ff5722, #4cd964); border-radius: 5px; }
    .anatomy-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; background: #0d131a; padding: 12px 10px; border-radius: 12px; border: 1px dashed #283748; }
    .area-shoulderR { grid-column: span 2; } .area-head { grid-column: span 2; } .area-shoulderL { grid-column: span 2; }
    .area-handR { grid-column: span 2; } .area-chest { grid-column: span 2; } .area-handL { grid-column: span 2; }
    .area-legR { grid-column: 2 / span 2; } .area-legL { grid-column: 4 / span 2; }
    .anatomy-card { background: #161f2a; border: 1px solid #2e3f54; border-radius: 10px; padding: 10px; min-height: 84px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
    .anatomy-card.part-dead { background: #10151c; border-color: #1e2632; opacity: 0.4; }
    .card-head-row { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(43, 57, 74, 0.8); padding-bottom: 5px; }
    .badge-hp-perc { background: #202c38; border: 1px solid #3c5066; font-size: 11px; font-weight: 900; padding: 2px 6px; border-radius: 5px; }
    .bar-meta { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700; margin-top: 1px; }
    .label-armor { color: #4facfe; font-weight: 800; } .label-body { color: #ff5e62; font-weight: 800; } .label-skeleton { color: #8fa0b5; }
    .bar-val { color: #ffffff; font-weight: 900; }
    .bar-track { width: 100%; height: 8px; background: #0a0e14; border-radius: 4px; border: 1px solid #202c3a; }
    .bar-fill-armor { height: 100%; background: linear-gradient(90deg, #00f2fe, #4facfe); border-radius: 4px; }
    .bar-fill-body { height: 100%; background: linear-gradient(90deg, #ff9966, #ff5e62); border-radius: 4px; }
    .badge-destroyed { font-size: 8.5px; font-weight: 900; color: #8fa0b5; background: rgba(143, 160, 181, 0.16); padding: 1.5px 5px; border-radius: 4px; }
    @media (max-width: 1080px) {
      .titan-dashboard-layout { grid-template-columns: 1fr; }
      .anatomy-grid { gap: 5px; padding: 8px; }
      .anatomy-card { min-height: 72px; padding: 6px; }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-btn">&larr; Voltar ao Menu</a>
  <div class="container">
    <div class="top-header-bar"><div class="title">Raid <span>Ao Vivo</span></div></div>
    <div class="subtitle" id="lastUpdateText">Sincronizando com Supabase...</div>
    
    <div class="section-block" id="secCurrentTitan" style="display: none;">
      <div class="titan-dashboard-layout">
        <div class="titan-info-box">
          <div class="titan-zone-row">
            <span class="badge-zone" id="mRaidName">Raid Ativa</span>
          </div>
          <div class="titan-name-row">
            <div class="titan-name-left">
              <span class="titan-seq" id="cTitanSeq">#</span>
              <span class="titan-name-text" id="cTitanName">Titã</span>
            </div>
            <span class="badge-ciclo-tag" id="cRaidCycle">Ciclo -</span>
          </div>
          <div class="hp-overall-box">
            <div class="hp-overall-labels"><span>Vida do Titã</span><span id="cTitanHpTxt">0 / 0 (0%)</span></div>
            <div class="hp-bar-outer"><div class="hp-bar-fill-overall" id="cTitanHpFill" style="width: 100%;"></div></div>
          </div>
        </div>

        <div class="anatomy-grid">
          <div class="anatomy-card area-shoulderR" id="card_ArmUpperRight"></div>
          <div class="anatomy-card area-head" id="card_Head"></div>
          <div class="anatomy-card area-shoulderL" id="card_ArmUpperLeft"></div>
          <div class="anatomy-card area-handR" id="card_HandRight"></div>
          <div class="anatomy-card area-chest" id="card_ChestUpper"></div>
          <div class="anatomy-card area-handL" id="card_HandLeft"></div>
          <div class="anatomy-card area-legR" id="card_LegUpperRight"></div>
          <div class="anatomy-card area-legL" id="card_LegUpperLeft"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hqhirsnowapylfwhvduf.supabase.co/rest/v1/eventos_raid';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxaGlyc25vd2FweWxmd2h2ZHVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MzU5MTgsImV4cCI6MjEwODUxMTkxOH0.d3IMYDumY7PZoM0ZdoiuMRikWjFXC0-rgR-dtUM-HZU';

    async function carregarPainel() {
      const txtStatus = document.getElementById('lastUpdateText');
      try {
        const res = await fetch(`${SUPABASE_URL}?order=id.desc&limit=5`, { 
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } 
        });
        
        if (!res.ok) throw new Error('Falha HTTP: ' + res.status);
        const eventos = await res.json();
        
        if (eventos.length === 0) {
          txtStatus.textContent = 'Tabela vazia no Supabase.';
          return;
        }

        let titan = null;
        let maxHp = 1;
        
        for (let ev of eventos) {
          if (!ev.dados) continue;
          if (ev.dados.raid_state?.current) {
            titan = ev.dados.raid_state.current;
            maxHp = titan.total_hp || titan.current_hp;
            break;
          }
          if (ev.dados.raid?.titans) {
            titan = ev.dados.raid.titans.find(t => t.current_hp > 0) || ev.dados.raid.titans[0];
            maxHp = titan.total_hp || titan.current_hp;
            break;
          }
        }

        if (!titan) {
          txtStatus.textContent = 'JSON lido, mas sem formato de Titã. Tipo do último: ' + eventos[0].tipo_evento;
          return;
        }

        txtStatus.textContent = 'Dados carregados com sucesso!';
        document.getElementById('secCurrentTitan').style.display = 'block';
        
        const nome = titan.id || titan.enemy_id || 'Titã';
        document.getElementById('cTitanName').textContent = nome;
        
        const hpAtual = titan.current_hp || 0;
        const perc = Math.max(0, Math.min(100, (hpAtual / maxHp) * 100));
        
        document.getElementById('cTitanHpTxt').textContent = `${hpAtual} / ${maxHp} (${perc.toFixed(1)}%)`;
        document.getElementById('cTitanHpFill').style.width = `${perc}%`;

      } catch (err) {
        txtStatus.textContent = 'Erro fatal JS: ' + err.message;
        document.getElementById('secCurrentTitan').style.display = 'none';
      }
    }

    window.addEventListener('load', carregarPainel);
  </script>
</body>
</html>
